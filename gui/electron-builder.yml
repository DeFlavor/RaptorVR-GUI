appId: com.raptorvr.gui
productName: Raptor VR GUI
artifactName: 'Raptor-VR-GUI-${version}-${os}-${arch}.${ext}'
electronUpdaterCompatibility: '>= 2.16'

publish:
  provider: github
  owner: DeFlavor
  repo: RaptorVR-GUI
  channel: latest
  releaseType: release

directories:
  output: dist/artifacts/${os}

asar: true
asarUnpack:
  - out/main/chunks/*.jar

electronLanguages:
  - en-US

files:
  - out/**/*
  - index.html
  - package.json
  - node_modules/**
  - '!node_modules/*/{README,readme,README.md,readme.md,CHANGELOG,CHANGELOG.md,changelog.md}'
  - '!node_modules/*/{test,tests,__tests__,docs,doc,example,examples}'
  - '!node_modules/*/.{git,github,vscode,editorconfig,eslintrc,prettierrc}'
  - '!node_modules/**/*.{map,ts,tsx,d.ts}'
  - '!**/.DS_Store'

extraFiles:
  - from: '../LICENSE-MIT'
    to: 'open-source-licenses/SlimeVR-LICENSE-MIT.txt'
  - from: '../LICENSE-APACHE'
    to: 'open-source-licenses/SlimeVR-LICENSE-APACHE.txt'
  - from: '../OPEN_SOURCE_NOTICES.txt'
    to: 'open-source-licenses/OPEN_SOURCE_NOTICES.txt'

linux:
  category: Game
  artifactName: 'Raptor-VR-GUI-${arch}.${ext}'
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  extraFiles:
    - from: '../server/desktop/build/libs/slimevr.jar'
      to: '.'
    - from: '../bindings-provider/build/linux-${arch}/slimevr-bindings-provider'
      to: '.'
    - from: '../bindings-provider/build/linux-${arch}/libopenvr_api.so'
      to: '.'
    - from: './electron/resources/69-slimevr-devices.rules'
      to: '.'
  icon: './electron/resources/icons'

deb:
  depends: [openjdk-17-jre-headless, udev]
  afterInstall: './electron/resources/scripts/postinstall.sh'
  afterRemove: './electron/resources/scripts/postremove.sh'

rpm:
  depends: [java-latest-openjdk, udev]
  afterInstall: './electron/resources/scripts/postinstall.sh'
  afterRemove: './electron/resources/scripts/postremove.sh'

win:
  artifactName: 'Raptor-VR-GUI-Windows-${arch}.${ext}'
  target:
    - target: nsis
    # electron-builder's runtime target identifier is `msiwrapped`.
    - target: msiwrapped
    - target: zip
  icon: './electron/resources/icons/icon.ico'
  extraFiles:
    - from: '../server/desktop/build/libs/slimevr.jar'
      to: '.'
    - from: '../server/core/resources'
      to: '.'
      filter: ['**/*']
    - from: '../bindings-provider/build/${os}-${arch}/Release/SlimeVR-Bindings-Provider.exe'
      to: '.'
    - from: '../bindings-provider/build/${os}-${arch}/openvr_api.dll'
      to: '.'
    - from: './electron/resources/jre'
      to: 'jre'
    - from: './electron/resources/steamvr-driver/raptorvr-openvr-driver-win64'
      to: 'raptorvr-openvr-driver-win64'

nsis:
  artifactName: 'Raptor-VR-GUI-Windows-${arch}.${ext}'
  include: './electron/resources/scripts/windows-installer.nsh'
  oneClick: true
  perMachine: true
  allowElevation: true
  deleteAppDataOnUninstall: false

msiWrapped:
  artifactName: 'Raptor-VR-GUI-Windows-${arch}.${ext}'
  upgradeCode: '{FA6856E5-0A29-4789-BBA8-9FEC4BF9B8B9}'
  warningsAsErrors: false
  impersonate: false
  wrappedInstallerArgs: '/S /allusers'

mac:
  target:
    - target: dmg
    - target: zip
  artifactName: 'Raptor-VR-GUI-macOS-${arch}.${ext}'
  x64ArchFiles: '**/register-protocol-handler.node'
  icon: './electron/resources/icons/icon.icns'
  extraFiles:
    - from: '../server/desktop/build/libs/slimevr.jar'
      to: 'Resources/slimevr.jar'
