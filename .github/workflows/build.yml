name: Raptor VR GUI Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to validate
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Configure Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix-cpp: ${{ steps.set-matrix.outputs.matrix-cpp }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          BASE='[{"os":"ubuntu-22.04","platform":"linux"},{"os":"windows-latest","platform":"windows"},{"os":"macos-latest","platform":"macos"}]'
          RESULT=$(echo "$BASE" | jq -c '.')
          RESULT_CPP=$(echo "$RESULT" | jq -c '[ .[] | select ( (.platform != "macos") and ( (.platform != "windows") or (.os | endswith("-arm") | not) ) ) ]')

          echo "matrix={\"include\":$RESULT}" >> "$GITHUB_OUTPUT"
          echo "matrix-cpp={\"include\":$RESULT_CPP}" >> "$GITHUB_OUTPUT"

  build-bindings-provider:
    name: Build bindings provider for ${{ matrix.os }}
    needs: [setup-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix-cpp) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - if: matrix.platform == 'linux'
        name: Install GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
      - name: Get CMake
        uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S bindings-provider/ -B bindings-provider/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build bindings-provider/build --config Release -j6
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-provider-${{ matrix.platform }}-${{ matrix.os }}
          path: |
            bindings-provider/build/slimevr-bindings-provider
            bindings-provider/build/libopenvr_api.so
            bindings-provider/build/Release/SlimeVR-Bindings-Provider.exe
            bindings-provider/build/openvr_api.dll

  gui-checks:
    name: Gui Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: GUI Lint
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir gui test:updater
          node --test tools/tests/sync-slimevr.test.mjs
          pnpm --dir gui lint

  java-checks:
    name: Java Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Java Spotless Check
        run: ./gradlew spotlessCheck --build-cache

  build-server-jar:
    name: Build Desktop Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build ShadowJar
        run: ./gradlew :server:desktop:shadowJar --build-cache
      - name: Test with Gradle
        run: ./gradlew :server:core:test :server:desktop:test
      - name: Upload Server Jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: |
            server/desktop/build/libs/slimevr.jar
            server/core/resources

  build-gui-frontend:
    name: Build GUI Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Build JS
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile && cd gui && pnpm run build
      - name: Tar GUI Dist
        run: tar -czf slimevr-gui-dist.tar.gz -C gui/out .
      - name: Upload GUI Dist
        uses: actions/upload-artifact@v7
        with:
          name: gui-dist
          path: slimevr-gui-dist.tar.gz

  package-desktop:
    name: Package Desktop (${{ matrix.platform }} - ${{ matrix.os }})
    needs:
      [
        setup-matrix,
        build-server-jar,
        build-gui-frontend,
        build-bindings-provider,
      ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - if: matrix.platform == 'windows'
        name: Set up bundled Java 17 runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jre'
          architecture: 'x64'
      - if: matrix.platform == 'windows'
        name: Stage bundled Java runtime
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'gui/electron/resources/jre'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $env:JAVA_HOME '*') -Destination $destination -Recurse -Force

          $java = Join-Path $destination 'bin/java.exe'
          if (-not (Test-Path -LiteralPath $java)) {
            throw 'Bundled Java executable was not staged'
          }
          & $java --version
      - if: matrix.platform == 'windows'
        name: Set up OpenVR driver build tools
        uses: lukka/get-cmake@latest
      - if: matrix.platform == 'windows'
        name: Build native RaptorVR OpenVR driver
        shell: pwsh
        run: ./tools/prepare-steamvr-driver.ps1
      - name: Download Server Jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: server
      - if: contains(fromJson(needs.setup-matrix.outputs.matrix-cpp).include.*.os, matrix.os)
        name: Download bindings provider artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-provider-${{ matrix.platform }}-${{ matrix.os }}
          path: bindings-provider/build/${{ matrix.platform == 'windows' && 'win' || 'linux' }}-${{ endsWith(matrix.os, '-arm') && 'arm64' || 'x64' }}
      - name: Download GUI Dist
        uses: actions/download-artifact@v8
        with:
          name: gui-dist
      - name: Extract GUI for Electron
        shell: bash
        run: mkdir -p gui/out && tar -xzf slimevr-gui-dist.tar.gz -C gui/out
      - name: Run Electron Builder
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          mkdir -p gui/dist/artifacts/linux/ \
                   gui/dist/artifacts/win \
                   gui/dist/artifacts/mac
          VERSION=$(node -p "require('./gui/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$SOURCE_REF" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "Building version: $VERSION"
          pnpm install --frozen-lockfile
          cd gui
          pnpm exec electron-builder --${{ matrix.platform }} \
            ${{ matrix.platform == 'macos' && '--universal' || '' }} \
            --config.extraMetadata.version="$VERSION" \
            --publish never
      - if: matrix.platform == 'windows'
        name: Validate bundled Java runtime
        shell: pwsh
        run: |
          $unpacked = Join-Path $env:GITHUB_WORKSPACE 'gui/dist/artifacts/win/win-unpacked'
          $java = Join-Path $unpacked 'jre/bin/java.exe'
          $probe = Get-ChildItem -Path (Join-Path $unpacked 'resources/app.asar.unpacked/out/main/chunks') -Filter 'JavaVersion-*.jar' | Select-Object -First 1

          if (-not (Test-Path -LiteralPath $java)) {
            throw 'Packaged application does not contain Java'
          }
          if (-not $probe) {
            throw 'Packaged application does not contain the Java version probe'
          }

          $version = & $java -jar $probe.FullName
          if ($LASTEXITCODE -ne 0 -or [double]$version -lt 17) {
            throw "Packaged Java validation failed: $version"
          }
          Write-Output "Validated bundled Java $version"
      - if: matrix.platform == 'windows'
        name: Validate bundled RaptorVR OpenVR driver
        shell: pwsh
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE 'gui/dist/artifacts/win/win-unpacked/raptorvr-openvr-driver-win64'
          $manifest = Get-Content -LiteralPath (Join-Path $driver 'driver.vrdrivermanifest') -Raw | ConvertFrom-Json
          $dll = Join-Path $driver 'bin/win64/driver_raptorvr.dll'
          $profile = Join-Path $driver 'resources/input/raptorvr_tracker_profile.json'
          $model = Join-Path $driver 'resources/rendermodels/raptorvr_tracker/raptorvr_tracker.json'

          if ($manifest.name -ne 'raptorvr') {
            throw "Unexpected OpenVR driver name: $($manifest.name)"
          }
          foreach ($requiredFile in @($dll, $profile, $model)) {
            if (-not (Test-Path -LiteralPath $requiredFile)) {
              throw "Packaged RaptorVR OpenVR driver is missing $requiredFile"
            }
          }
          Write-Output "Validated native RaptorVR OpenVR driver: $dll"
      - if: matrix.platform == 'windows'
        name: Validate MSI installer and update payload
        shell: pwsh
        run: |
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'gui/dist/artifacts/win'
          $msi = Get-ChildItem -LiteralPath $artifacts -Filter 'Raptor-VR-GUI-Windows-*.msi'
          $updater = Get-ChildItem -LiteralPath $artifacts -Filter 'Raptor-VR-GUI-Windows-*.exe'
          $metadata = Join-Path $artifacts 'latest.yml'

          if ($msi.Count -ne 1) {
            throw "Expected one MSI installer, found $($msi.Count)"
          }
          if ($updater.Count -ne 1) {
            throw "Expected one automatic-update payload, found $($updater.Count)"
          }
          if (-not (Test-Path -LiteralPath $metadata)) {
            throw 'Windows automatic-update metadata was not generated'
          }

          $updateMetadata = Get-Content -LiteralPath $metadata -Raw
          if ($updateMetadata -notmatch [regex]::Escape($updater.Name)) {
            throw "Windows update metadata does not reference $($updater.Name)"
          }
          Write-Output "Validated public MSI installer: $($msi.Name)"
          Write-Output "Validated internal automatic-update payload: $($updater.Name)"
      - name: Collect Release Artifacts
        shell: bash
        run: |
          SRC_DIR="${{ github.workspace }}/gui/dist/artifacts"
          DEST_DIR="${{ github.workspace }}/release-out"
          mkdir -p "$DEST_DIR"

          if [ "${{ matrix.platform }}" == "windows" ]; then
            find "$SRC_DIR/win" -maxdepth 1 -type f -exec cp {} "$DEST_DIR/" \;

          elif [ "${{ matrix.platform }}" == "linux" ]; then
            find "$SRC_DIR/linux" -maxdepth 1 -type f -exec cp {} "$DEST_DIR/" \;

          elif [ "${{ matrix.platform }}" == "macos" ]; then
            find "$SRC_DIR/mac" -maxdepth 1 -type f -exec cp {} "$DEST_DIR/" \;
          fi

          echo "Collected files:"
          ls -lh "$DEST_DIR"
      - name: Upload For Release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.os }}
          path: release-out/*

  create-release:
    name: Publish Raptor VR GUI Release
    needs: [gui-checks, java-checks, package-desktop]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-out
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-out/*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
